name: bratCode Deployment

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            action:
                description: "Choose Action (apply to build, destroy to delete)"
                required: true
                default: "apply"
                type: choice
                options:
                    - apply
                    - destroy

jobs:
    terraform:
        name: "Terraform Infrastructure"
        runs-on: ubuntu-latest
        outputs:
            acr_name: ${{ steps.tf-out.outputs.acr_name }}
            acr_login_server: ${{ steps.tf-out.outputs.acr_login_server }}
            rg_name: ${{ steps.tf-out.outputs.rg_name }}
            aks_name: ${{ steps.tf-out.outputs.aks_name }}

        defaults:
            run:
                working-directory: ./terraform

        env:
            ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
            ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
            ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
            ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              run: terraform init

            - name: Force Unlock Terraform State
              if: github.event_name == 'push' || github.event.inputs.action == 'apply'
              run: terraform force-unlock -force d9d2788a-8977-84f7-0042-8649959a2c75 || true

            - name: Terraform Apply
              if: github.event_name == 'push' || github.event.inputs.action == 'apply'
              run: terraform apply -auto-approve

            - name: Export Outputs
              id: tf-out
              if: github.event_name == 'push' || github.event.inputs.action == 'apply'
              run: |
                  echo "rg_name=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
                  echo "acr_name=$(terraform output -raw acr_name)" >> $GITHUB_OUTPUT
                  echo "acr_login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT
                  echo "aks_name=$(terraform output -raw aks_cluster_name)" >> $GITHUB_OUTPUT

            - name: Terraform Destroy
              if: github.event.inputs.action == 'destroy'
              run: terraform destroy -auto-approve

    build-backend:
        name: "Build Backend Services"
        needs: terraform
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        strategy:
            matrix:
                service: [gateway, auth, file, terminal, project, ai, payment]

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Log into Azure
              uses: azure/login@v2
              with:
                  creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

            - name: Log into ACR
              run: az acr login --name ${{ needs.terraform.outputs.acr_name }}

            - name: Inject Firebase Credentials
              run: |
                  echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > apps/backend/services/auth-service/serviceAccountKey.json
                  sed -i '/serviceAccountKey.json/d' .gitignore

            - name: Build & Push
              run: |
                  docker build -f Dockerfile.backend --build-arg SERVICE_NAME=${{ matrix.service }} -t ${{ needs.terraform.outputs.acr_login_server }}/${{ matrix.service }}:latest .
                  docker push ${{ needs.terraform.outputs.acr_login_server }}/${{ matrix.service }}:latest

    build-frontend:
        name: "Build Frontend"
        needs: terraform
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Log into Azure
              uses: azure/login@v2
              with:
                  creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

            - name: Log into ACR
              run: az acr login --name ${{ needs.terraform.outputs.acr_name }}

            - name: Build & Push Frontend
              run: |
                  docker build -f Dockerfile.frontend \
                    --build-arg VITE_SERVER_URL="https://api.bratcode.bharatrajsingal.online" \
                    --build-arg VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
                    --build-arg VITE_TERMINAL_SERVICE_URL="https://terminal.bratcode.bharatrajsingal.online" \
                    -t ${{ needs.terraform.outputs.acr_login_server }}/frontend-app:latest .
                  docker push ${{ needs.terraform.outputs.acr_login_server }}/frontend-app:latest

    deploy-k8s:
        name: "Deploy to Kubernetes"
        needs: [terraform, build-backend, build-frontend]
        runs-on: ubuntu-latest
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Log into Azure
              uses: azure/login@v2
              with:
                  creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

            - name: Get AKS Credentials
              run: az aks get-credentials --resource-group ${{ needs.terraform.outputs.rg_name }} --name ${{ needs.terraform.outputs.aks_name }} --overwrite-existing

            - name: Create Application Secrets
              run: |
                  kubectl create secret generic app-secrets \
                    --from-literal=FRONTEND_URL="https://bratcode.bharatrajsingal.online" \
                    --from-literal=AUTH_SERVICE="http://auth-service:8001" \
                    --from-literal=PROJECT_SERVICE="http://project-service:8002" \
                    --from-literal=FILE_SERVICE="http://file-service:8003" \
                    --from-literal=AI_SERVICE="http://ai-service:8004" \
                    --from-literal=TERMINAL_SERVICE="http://terminal-service:8005" \
                    --from-literal=PAYMENT_SERVICE="http://payment-service:8006" \
                    --from-literal=REDIS_URL="redis://redis-service:6379" \
                    --from-literal=MONGO_BASE_URI="${{ secrets.MONGO_BASE_URI }}" \
                    --from-literal=GOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}" \
                    --from-literal=RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}" \
                    --from-literal=RAZORPAY_KEY_SECRET="${{ secrets.RAZORPAY_KEY_SECRET }}" \
                    --dry-run=client -o yaml | kubectl apply -f -

            - name: Apply Kubernetes Manifests
              run: |
                  # Replace YOUR_REGISTRY with the actual ACR server dynamically
                  sed -i "s/YOUR_REGISTRY/${{ needs.terraform.outputs.acr_login_server }}/g" k8s/deployments.yaml
                  kubectl apply -f k8s/rbac.yaml
                  kubectl apply -f k8s/services.yaml
                  kubectl apply -f k8s/deployments.yaml
                  kubectl apply -f k8s/pvc.yaml

                  # Force Kubernetes to pull the new :latest images!
                  kubectl get deployments -o name | xargs -r kubectl rollout restart

            - name: Install Nginx Ingress Controller
              run: |
                  helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                  helm repo update
                  helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
                    --namespace ingress-basic --create-namespace \
                    --set controller.service.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-health-probe-request-path"=/healthz

            - name: Wait for Public IP
              id: get-ip
              run: |
                  echo "Waiting for Azure to assign a Public IP to the Load Balancer..."
                  IP=""
                  while [ -z $IP ]; do
                    IP=$(kubectl get svc ingress-nginx-controller -n ingress-basic -o jsonpath="{.status.loadBalancer.ingress[0].ip}")
                    [ -z "$IP" ] && sleep 10
                  done
                  echo "Public IP is: $IP"
                  echo "public_ip=$IP" >> $GITHUB_OUTPUT

                  # Wait for NGINX Ingress Controller to be ready
                  kubectl wait --namespace ingress-basic \
                    --for=condition=ready pod \
                    --selector=app.kubernetes.io/component=controller \
                    --timeout=120s

                  # Now apply the ingress rules so it routes traffic!
                  kubectl apply -f k8s/ingress.yaml

            - name: Update GoDaddy DNS
              run: |
                  IP="${{ steps.get-ip.outputs.public_ip }}"

                  # Update A record for bratcode.bharatrajsingal.online
                  curl -f -s --show-error -X PUT "https://api.godaddy.com/v1/domains/bharatrajsingal.online/records/A/bratcode" \
                  -H "Authorization: Bearer ${{ secrets.GODADDY_PAT }}" \
                  -H "Content-Type: application/json" \
                  -d '[{"data": "'$IP'", "ttl": 600}]'

                  # Update A record for api.bratcode.bharatrajsingal.online
                  curl -f -s --show-error -X PUT "https://api.godaddy.com/v1/domains/bharatrajsingal.online/records/A/api.bratcode" \
                  -H "Authorization: Bearer ${{ secrets.GODADDY_PAT }}" \
                  -H "Content-Type: application/json" \
                  -d '[{"data": "'$IP'", "ttl": 600}]'

                  # Update A record for terminal.bratcode.bharatrajsingal.online
                  curl -f -s --show-error -X PUT "https://api.godaddy.com/v1/domains/bharatrajsingal.online/records/A/terminal.bratcode" \
                  -H "Authorization: Bearer ${{ secrets.GODADDY_PAT }}" \
                  -H "Content-Type: application/json" \
                  -d '[{"data": "'$IP'", "ttl": 600}]'

                  echo "Successfully updated GoDaddy DNS!"
