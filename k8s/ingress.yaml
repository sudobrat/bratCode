# ==========================================
# KUBERNETES INGRESS (THE FRONT DOOR)
# ==========================================
# This acts as a reverse proxy/load balancer.
# Because your frontend code currently expects the backend to be on a different URL
# (e.g. VITE_SERVER_URL in your .env), we will use subdomain routing instead of path routing.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: bratcode-ingress
    annotations:
        # This assumes we will install the popular Nginx Ingress Controller
        kubernetes.io/ingress.class: "nginx"
        # SSL/TLS configuration can be added here later
spec:
    rules:
        # 1. Traffic for the main website goes to the React Frontend
        - host: bratcode.bharatrajsingal.online
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: frontend-service
                            port:
                                number: 80

        # 2. Traffic for the API (what your axios calls) goes to the Gateway
        - host: api.bratcode.bharatrajsingal.online
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: gateway-service
                            port:
                                number: 8000

        # 3. Traffic for the Terminal WebSockets goes to the Terminal Service
        - host: terminal.bratcode.bharatrajsingal.online
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: terminal-service
                            port:
                                number: 8005
