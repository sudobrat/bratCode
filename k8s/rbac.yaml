apiVersion: v1
kind: ServiceAccount
metadata:
  name: ide-manager-sa
  # This service account will be used by our terminal-service and file-service 
  # so they have permission to spawn workspace pods.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ide-manager-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "services"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ide-manager-rolebinding
subjects:
  - kind: ServiceAccount
    name: ide-manager-sa
roleRef:
  kind: Role
  name: ide-manager-role
  apiGroup: rbac.authorization.k8s.io
