# ==========================================
# KUBERNETES DEPLOYMENTS
# ==========================================
# A Deployment manages a set of duplicate Pods. If a Pod crashes, 
# the Deployment automatically creates a new one.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: YOUR_REGISTRY/gateway:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: app-secrets # We will create this in Terraform!
---
