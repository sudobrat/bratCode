apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file
  template:
    metadata:
      labels:
        app: file
    spec:
      # CRITICAL: This gives the file-service permission to spawn and exec into pods!
      serviceAccountName: ide-manager-sa
      containers:
        - name: file
          image: YOUR_REGISTRY/file:latest
          ports:
            - containerPort: 8003
          envFrom:
            - secretRef:
                name: app-secrets
